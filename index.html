    <script>
      // Early interceptor for external client tracer rejections
      window.addEventListener('unhandledrejection', function(event) {
        if (!event.reason || (typeof event.reason === 'object' && Object.keys(event.reason).length === 0) || String(event.reason).includes('Vercel Client Tracer')) {
          event.stopImmediatePropagation();
          event.preventDefault();
          return true;
        }
      }, true);
      window.addEventListener('error', function(event) {
        if (event.message && (event.message.includes('Vercel Client Tracer') || event.message.includes('Script error'))) {
          event.stopImmediatePropagation();
          event.preventDefault();
          return true;
        }
      }, true);
    </script>
